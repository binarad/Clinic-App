services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres-container
    restart: unless-stopped
    environment: 
      POSTGRES_USER: binarad
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clinic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U binarad -d clinic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
