[workspace]
resolver = "3"
members = ["backend", "desktop-app"]


[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }

# Async
tokio = { version = "1.52.1", features = ["full"] }

# Error handling
anyhow = "1.0.102"
thiserror = "2"

serde = {version = "1.0.229", features = ["derive"]}
