[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"

# Password hashing
argon2 = "0.6.0"
password-hash = "0.6.1"
rand_core = {version = "0.10.1" }

dotenvy = "0.15.7"

# ORM
diesel = { version = "2.3.13", features = ["postgres", "r2d2", "chrono"] }

chrono.workspace = true
tokio.workspace = true

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true


# LOGS 
uuid = {version = "1.26.1", features = ["v4", "serde"]}
log = "0.4.34"
tracing = { version = "0.1.44", features = ["log"]}
env_logger = "0.11.11"
